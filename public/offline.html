<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#091b19">
    <title>Stranded Philippines is offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 1.5rem; place-items: center; color: #fff; background: #071715; }
      main { width: min(100%, 24rem); padding: 1.5rem; background: #10211f; border: 1px solid #334b48; border-radius: 1.25rem; text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1.1rem; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.35rem; }
      p { margin: 0 0 1.25rem; color: #c7d4d1; line-height: 1.5; }
      a { display: block; padding: 0.85rem 1rem; color: white; background: #4d78f9; border-radius: 0.8rem; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/radar-icon-192.png" alt="">
      <h1>You are offline</h1>
      <p>Live reports and heatmaps require an internet connection. Reconnect before reporting your location.</p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
