name: stranded-detector-funnel

services:
  tailscale:
    image: "${TAILSCALE_IMAGE:-tailscale/tailscale:latest}"
    hostname: "${TS_HOSTNAME:-stranded-detector}"
    restart: unless-stopped
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: "${TS_HOSTNAME:-stranded-detector}"
      TS_SERVE_CONFIG: /config/funnel.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-config:/config:ro

  stranded-detector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.funnel
    depends_on:
      - tailscale
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - stranded-detector-backend
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      DATABASE_PATH: /data/stranded.sqlite
    volumes:
      - stranded-data:/data

volumes:
  stranded-data:
  tailscale-state:
